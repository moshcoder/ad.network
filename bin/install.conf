# bin/install.sh settings for ad.network (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: settings go in $STATE_DIR/app.env, written from the logicsrc
# vault profullstack/ad-network--prod (ADNETWORK_KEY, ADNETWORK_COINPAY_CLIENT_ID,
# ADNETWORK_COINPAY_CLIENT_SECRET, ADNETWORK_ADVERTISER_TOKEN, ADNETWORK_PUBLISHER_TOKEN).
#
# ad.network.pit.world is a pit.world hostname (.network is a real ICANN ending,
# so there is no Moshpit name). *.pit.world already points at dev2; its exact-name
# nginx vhost and Let's Encrypt cert come from pit-proxy-cert, see README.
APP=ad-network
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8800
HEALTH_PATH=/health
DOMAINS=
ACCESS_LOG=off
